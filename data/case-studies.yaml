# Case studies (application domains) and the applications INES.IA develops in each.
#
# Rendered by layouts/case-studies/list.html. The Results page also groups
# publications, tools and theses by `slug`/`domain`, so keep those stable.
#
# Domain fields:
#   slug         Anchor id and key used by `relatedSlug` in the other data files.
#   domain       Display name of the domain.
#   title        Name of the case study / research line in this domain.
#   description  What INES.IA does in this domain.
#   apps         Zero or more applications (omit or leave empty when there are none).
#
# App fields (only `name` and `description` are required):
#   key          Unique id, used as the card anchor (/case-studies/#<key>).
#   name         Application name.
#   subtitle     Optional secondary line: full name or platform, e.g. "Mobile app".
#   description  One or two sentences on what the application does.
#   logo         Optional image path under static/, e.g. "/img/case-studies/<key>.svg".
#                Without a logo, the card shows the app's initials.
#   links        Optional; empty values are not rendered.
#     website    Access link (web app or project site).
#     playStore  Google Play listing.
#     appStore   Apple App Store listing.
#     repo       Source-code repository.
#
# To add an application, append an entry to the domain's `apps` list. The page
# layout adapts to any number of apps; no template change is needed.
studies:
  - slug: "health"
    domain: "Health"
    title: "AI-Assisted Skin Lesion Detection"
    description: "An application for detecting melanoma and other skin lesions, tuned to the diversity of the Brazilian population, using learning models optimized to run on mobile phones to protect patient privacy."
    apps:
      - key: "derm-ai"
        name: "Derm.AI"
        subtitle: "Mobile app"
        description: "Uses machine learning models to assist in the analysis of skin lesions such as melanoma. The models are developed with the diversity of the Brazilian population in mind and optimized to run directly on mobile devices, and the app supports quality-driven acquisition of clinical images for AI classification."
        logo: "/img/case-studies/derm-ai.png"
        links:
          website: ""  
          playStore: "https://play.google.com/store/apps/details?id=com.luxai.dermaiyou&hl=pt" 
          appStore: "https://apps.apple.com/br/app/derm-ai-you/id6813496387"  
          repo: ""

  - slug: "education"
    domain: "Education"
    title: "AI-Generated Teaching Materials"
    description: "AI applications that help instructors produce educational materials grounded in what is actually taught in their classes, reducing their workload while keeping the content faithful to the classroom and giving students reliable resources for study."
    apps:
      - key: "sigame"
        name: "SIGAME"
        subtitle: "Sistema Inteligente de Geração Automatizada de Materiais Educacionais"
        description: "Turns recorded lectures, audio, and slides into structured teaching materials ready to distribute. Rather than inventing content, it faithfully extracts what was taught, strips out the informalities of spoken language, and organizes the text into a document synchronized with the slides presented."
        logo: "/img/case-studies/sigame.svg"
        links:
          website: "https://sigame.space/"
          playStore: ""
          appStore: ""
          repo: ""

  - slug: "environmental-crisis-management"
    domain: "Environmental Crisis Management"
    title: "Monitoring and Response to Urban Flooding"
    description: "Solutions to support monitoring, proactive planning, and response to natural disasters, with an initial focus on urban flooding, developed in partnership with IPECTI-FACEPE."
    apps: []

  - slug: "justice"
    domain: "Justice"
    title: "Process Mining for the Judicial System"
    description: "Enhancing the JuMP tool with machine learning models to identify inefficiencies, predict patterns, analyze compliance, detect bottlenecks, and recommend interventions across judicial workflows, in partnership with the National Council of Justice (CNJ)."
    apps: []

  - slug: "carbon-credits"
    domain: "Carbon Credits"
    title: "Blockchain-Based Carbon Credit Trading"
    description: "An AI-based solution for trading carbon credits on the blockchain, using AI to turn natural-language requirements into smart contracts that automate tracking, verification, and transfer registration."
    apps: []

  - slug: "robotics"
    domain: "Robotics"
    title: "Formal Methods and Generative AI for Robotics"
    description: "Modeling, simulating, verifying, and implementing robotic applications using AI techniques combined with formal methods, advancing software engineering processes for robotic systems."
    apps: []
