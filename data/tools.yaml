# Tools developed by INES.IA, added manually from the "New Tool" issue template.
# Each tool becomes an achievement on the Results page, grouped like publications
# by relatedType ("case-study" or "theme") + relatedSlug.
tools:
  - key: "rv4android"
    name: "RV4Android"
    description: "An end-to-end runtime verification pipeline for contemporary Android applications. It modernizes the instrumentation pipeline, compiles specifications (e.g., JCA usage rules specified with JavaMOP) into runtime monitors, injects them into APKs, and automates execution with Android test-generation tools while measuring execution coverage. Within INES.IA, RV4Android is used to investigate the capabilities of AI-based extensions to test-case generation tools for identifying API misuses."
    repoLink: "https://github.com/PAMunb/rvsec/tree/master/rv-android"
    relatedType: "theme"
    relatedSlug: "verification-ai4se"

  - key: "cobol-spec-driven-pipeline"
    name: "Spec-Driven COBOL Documentation Pipeline"
    description: "A rule-governed, specification-driven pipeline for recovering and organizing knowledge from COBOL legacy systems with LLM support. It decomposes legacy-system understanding into nine concern-bounded stages, producing reusable intermediate artifacts with traceability to repository evidence and explicit recording of uncertainty (Verified, Inferred, Unknown, or Confirmation Required)."
    repoLink: "https://github.com/ppgi-2025-cobol/preliminary-work"
    relatedType: "theme"
    relatedSlug: "maintenance-evolution-ai4se"

  - key: "sigame"
    name: "SIGAME - Sistema Inteligente de Geração Automatizada de Materiais Educacionais"
    description: "SIGAME turns recorded lectures, audio, and slides into structured teaching materials that are ready to distribute. Unlike general-purpose AI tools, it doesn't invent content: it faithfully extracts what was actually taught in class, strips out the informalities of spoken language, and organizes the text into a document synchronized with the slides presented. Instructors get quality supporting material without adding to their workload, and students can generate supplementary material straight from recorded classes."
    repoLink: "https://sigame.space/"
    relatedType: "case-study"
    relatedSlug: "education"
