  - key: "lima2026harmfulcode"
    degree: "PhD"
    student: "Rodrigo dos Santos Lima"
    advisor: "Prof. Leopoldo Motta Teixeira (UFPE / Centro de Informática)"
    coadvisor: "Prof. Baldoino Fonseca dos Santos Neto (UFAL / Instituto de Computação)"
    program: "Programa de Pós-Graduação em Ciência da Computação — UFPE / Centro de Informática"
    title: "Understanding and Detecting Harmful Code"
    defenseDate: "2026-08-12"
    location: "13h30 — via Google Meet"
    committee:
      - "Prof. Vinicius Cardoso Garcia (UFPE / Centro de Informática)"
      - "Profa. Juliana Alves Pereira (PUC-RJ / Departamento de Informática)"
      - "Prof. Wesley Klewerton Guez Assunção (North Carolina State University)"
      - "Prof. Ivan do Carmo Machado (UFBA / Depto de Ciência da Computação)"
      - "Prof. Matheus Henrique Esteves Paixão (UECE / Departamento de Informática)"
    abstract: "Code Smells normalmente indicam decisões e implementações de projeto inadequadas que podem degradar a qualidade do software. Por isso, precisam ser cuidadosamente detectadas para evitar tais consequências negativas. Nesse contexto, alguns estudos buscam compreender o impacto das Code Smells na qualidade do software, enquanto outros propõem técnicas baseadas em regras ou em aprendizado de máquina para detectá-las. No entanto, essas abordagens não se concentram em identificar quais trechos de código são de fato prejudiciais à qualidade do software. Nesta tese, definimos Código Prejudicial (Harmful Code) como um elemento de código Smelly (contém Code Smell) que também possui um ou mais bugs reportados - corrigidos ou não. A presença de código prejudicial sugere um risco maior de introdução de novos defeitos ou de degradação do projeto durante tarefas de manutenção e evolução. Categorizamos o código em quatro tipos: Clean, Smelly, Buggy e Harmful, e utilizamos essa taxonomia para analisar e detectar a nocividade em projetos de software. Investigamos as representações sociais do código prejudicial em uma comunidade de desenvolvedores de software composta por estudantes de pós-graduação brasileiros e profissionais da indústria. Realizamos tarefas de associação livre com membros dessa comunidade para capturar suas percepções espontâneas sobre código prejudicial e, em seguida, compilamos as associações para caracterizar suas representações sociais compartilhadas. Avaliamos também a viabilidade do aprendizado por transferência (transfer learning) em três tarefas comuns de engenharia de software: Code Smells, Mudanças Introdutoras de Defeitos e Harmful Code. Para isso, focamos em projetos de código aberto escritos em linguagens de programação populares: Java, C++ e C#. Avaliamos a eficácia e a eficiência dos modelos de aprendizado por transferência nessas tarefas e analisamos a complexidade de modelo necessária para alcançar desempenho satisfatório."
