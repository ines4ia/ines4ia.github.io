members:
  # ── Coordinator ──────────────────────────────────────────────────────
  - name: "Augusto Sampaio"
    slug: "augusto-sampaio"
    category: "Coordinator"
    role: "Coordinator"
    affiliation: "Universidade Federal de Pernambuco - CIn/UFPE"
    photo: "/img/team/augusto-sampaio.jpg"
    bio: "Augusto Sampaio is a Full Professor of Software Engineering at the Centro de Informática (CIn), Universidade Federal de Pernambuco (UFPE), where he has worked since 2007. He holds a Ph.D. from the University of Oxford and a B.Sc. and M.Sc. from UFPE. His research focuses on formal methods, software testing, model-based testing, algebraic transformations, and verification of systems, including smart contracts and avionics applications. He has supervised more than 40 graduate students and published over 100 papers, has coordinated major projects such as COMPASS (EU FP7) and a National Institute for Science and Technology in Software Engineering, and has led the Brazil Test Center collaboration with Motorola since 2002. He is a Commander of the National Order of Scientific Merit (2010), a Doctor Honoris Causa from the University of York (2016), a member of the Pernambuco Academy of Sciences (2021), and a CNPq Productivity Researcher since 1995."
    webpage: "https://www.cin.ufpe.br/~acas/"

  - name: "Paulo Borba"
    slug: "paulo-borba"
    category: "Coordinator"
    role: "Coordinator"
    affiliation: "Universidade Federal de Pernambuco - CIn/UFPE"
    photo: "/img/team/paulo-borba.jpg"
    bio: "Paulo Borba is a Professor of Software Engineering at the Centro de Informática (CIn), Universidade Federal de Pernambuco (UFPE), where he leads the Software Productivity Group and served as Director from 2021 to 2025. He holds a D.Phil. in Computing from the University of Oxford. His research investigates tools and techniques for improving software development quality and productivity, including advanced code merging, code integration conflicts, continuous integration and deployment, software modularity, software product lines, and refactoring. He is an Associate Editor of IEEE Transactions on Software Engineering, a Fulbright Visiting Faculty Scholar at Carnegie Mellon University's Institute for Software Research, and co-founder of the Qualiti Software Processes spin-off."
    orcid: "https://orcid.org/0000-0002-0381-2843"
    lattes: "http://lattes.cnpq.br/9395715443254344"
    webpage: "https://pauloborba.cin.ufpe.br/"

  - name: "Sergio Soares"
    slug: "sergio-soares"
    category: "Coordinator"
    role: "Coordinator"
    affiliation: "CIn-UFPE"
    photo: "/img/team/sergio-soares.jpg"
    bio: "Sérgio Soares completed his Ph.D. in Computer Science at the Federal University of Pernambuco in 2004. He is currently Director and Full Professor at the Centro de Informática of the Federal University of Pernambuco (CIn/UFPE), one of the top five academic Computing groups in Brazil. He is chair of the board of CESAR (Recife Center for Advanced Studies and Systems) and a board member of the Porto Digital Management Unit and of FADE (UFPE's Development Support Foundation). He was a Visiting Researcher at the MIT Industrial Performance Center, researching how digitalization increases industrial productivity. He has published more than 170 papers and has over 3,600 citations according to Google Scholar, and has supervised more than 150 postdoctoral, doctoral, master's, specialization, undergraduate research, and capstone students in Computer Science. He has experience coordinating development, research, and innovation projects funded by SENAI, CNPq, FACEPE, FINEP, Petrobras, Brazil's Informatics Law, and industry. Since 2008 he has been Executive Coordinator of INES — the National Institute of Science and Technology for Software Engineering, an INCT of MCTI/CNPq. He has been a member of the Brazilian Computer Society (SBC) since 2002. He works in Computer Science with an emphasis on Software Engineering, focusing mainly on Experimental Software Engineering, Digital Transformation, Data Protection and Privacy, Open Science, Smart Cities, Knowledge Management, and Digital Health. He was Director of the SENAI Institute of Innovation for Information and Communication Technologies (ISI-TICs) from 2013 to 2020, responsible for conceiving, creating, and developing the institute during its first seven years. From 2018 to 2020 he served as Leader of SENAI's More Advanced Industry (I+A) Market Alliance, responsible for addressing challenges related to Industry 4.0, Advanced Manufacturing, IoT, and Digitalization for Brazilian industry."
    orcid: "https://orcid.org/0000-0002-4428-2535"
    lattes: "http://lattes.cnpq.br/6456667887502521"
    webpage: "https://www.cin.ufpe.br/~scbs/"

  # ── Faculty ──────────────────────────────────────────────────────────
  - name: "Fernanda Madeiral"
    slug: "fernanda-madeiral"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal de Pernambuco - CIn/UFPE"
    photo: "/img/team/fernanda-madeiral.jpg"
    bio: "Fernanda Madeiral is an Assistant Professor at the Centro de Informática (CIn) of the Universidade Federal de Pernambuco (UFPE), Brazil. Her research pursues two broad goals: 1) helping developers produce and maintain high-quality software systems and 2) strengthening the Software Engineering research community. On software quality, her research interests include software bugs, linter violations, and source code understandability. To support the research community, she investigates Open Science practices and research artifact sharing, aiming to improve the transparency, reuse, and impact of Software Engineering research. She holds a Ph.D. in Software Engineering from the Universidade Federal de Uberlândia (Brazil). Before joining UFPE, she was a postdoctoral researcher at the KTH Royal Institute of Technology (Sweden) and an Assistant Professor at the Vrije Universiteit Amsterdam (Netherlands)."
    orcid: "https://orcid.org/0000-0003-2048-7648"
    lattes: "http://lattes.cnpq.br/8246690925340020"
    webpage: "https://fermadeiral.github.io"

  - name: "Juliana Saraiva"
    slug: "juliana-saraiva"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal da Paraíba - UFPB"
    photo: "/img/team/juliana-saraiva.jpg"
    bio: "Juliana Saraiva is an Associate Professor at the Federal University of Paraíba (UFPB), where she currently serves as the University's Data Protection Officer (DPO). She is also an attorney-at-law (OAB/RN, Brazil). She holds a Ph.D. in Computer Science from the Federal University of Pernambuco (UFPE), completed a postdoctoral fellowship in Information Security and Smart Cities, earned a Law degree from the Federal University of Rio Grande do Norte (UFRN), and holds the internationally recognized EXIN Privacy and Data Protection Essentials (LGPD) certification. Her research, teaching, and consulting activities focus on Software Engineering, Personal Data Protection, Artificial Intelligence, Information Security, and Data Governance. She leads the SafeDatAI research group, dedicated to the development of privacy-preserving and LGPD-compliant AI solutions, as well as research initiatives on assistive technologies. Her research interests include Privacy by Design, data governance, regulatory compliance, and the development of secure, inclusive, and trustworthy software systems."
    orcid: "https://orcid.org/0000-0002-3857-1111"
    lattes: "http://lattes.cnpq.br/5796569578057076"

  - name: "Leonardo Murta"
    slug: "leonardo-murta"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal Fluminense - UFF"
    photo: "/img/team/leonardo-murta.jpg"
    bio: "Leonardo Gresta Paulino Murta is an Associate Professor at the Computer Science Institute of Universidade Federal Fluminense (UFF). He holds a Ph.D. (2006) and a M.S. (2002) degree in Systems Engineering and Computer Science from COPPE/UFRJ, and a B.S. (1999) degree in Informatics from IM/UFRJ. He has a productivity research grant level 1D from CNPq and a scientist research grant from FAPERJ. He has published around 50 journal papers and 150 conference papers, and received two ACM SIGSOFT Distinguished Paper Awards at ASE 2006 and MSR 2019 and five best paper awards at SBES, in 2009, 2014, 2016, 2020, and 2022. He has served as program committee member of ICSE 2014, program chair of SBQS 2009, SBES 2015, ICSE NIER 2019, AICCSA 2019, and CIbSE 2020, among others. He is also associate editor of JBCS since 2013 and was editor in chief of JSERD from 2017 to 2020. His research area is software engineering, and his current research interests include configuration management and provenance."
    orcid: "https://orcid.org/0000-0002-5173-1247"
    lattes: "http://lattes.cnpq.br/1565296529736448"
    webpage: "https://leomurta.github.io"

  - name: "Leopoldo Teixeira"
    slug: "leopoldo-teixeira"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal de Pernambuco - CIn/UFPE"
    photo: "/img/team/leopoldo-teixeira.jpg"
    bio: "Leopoldo is an associate professor at the Informatics Center (CIn) of the Federal University of Pernambuco, where he leads the Software Testing and Analysis Research group. He is also affiliated with the Software Productivity Group and CIn-Trust. In 2022, he was a CAPES-Alexander von Humboldt Experienced Research Fellow at the Chair of Software Engineering of Universität des Saarlandes. His research interests involve Software Engineering, with a focus on providing strong foundations for improving software quality and productivity. In particular, his research has focused on software product lines and configurable systems, refactoring, program analysis, software testing, formal methods, and mobile development."
    orcid: "https://orcid.org/0000-0002-6154-1666"
    lattes: "http://lattes.cnpq.br/2117651910340729"
    webpage: "https://leopoldomt.github.io/"

  - name: "Lincoln Rocha"
    slug: "lincoln-rocha"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal do Ceará - UFC"
    photo: "/img/team/lincoln-rocha.jpg"
    bio: "Lincoln Rocha is an Associate Professor at the Department of Computing of the Federal University of Ceará, Brazil, where he leads the Alan Turing Research Laboratory (ATLab). He holds a Ph.D. degree in Computer Science from the Federal University of Ceará (2013). His main research area is Software Engineering, working mainly (but not only) on the following topics: exception handling, software defect prediction, mining software repositories, architectural technical debt, atoms of confusion, software vulnerability mining and analysis, and intelligent software engineering (AI4SE and SE4AI)."
    orcid: "https://orcid.org/0000-0001-5402-8744"
    lattes: "http://lattes.cnpq.br/0656977742590515"

  - name: "Marcel Oliveira"
    slug: "marcel-oliveira"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal do Rio Grande do Norte - UFRN"
    bio: "Marcel Vinicius Medeiros Oliveira is a Full Professor at the Department of Informatics and Applied Mathematics (DIMAp) of the Federal University of Rio Grande do Norte (UFRN). He holds a B.Sc. in Computer Science from the Federal University of Pernambuco (2000), an M.Sc. in Computer Science from the Federal University of Pernambuco (2002), and a Ph.D. in Computer Science from the University of York, England (2006). He is currently a member of the National Institute for Software Engineering, a member of the Brazilian Computer Society's Special Committee on Formal Methods, a member of UFRN's Graduate Program in Systems and Computing (PPgSC) Collegiate, and Coordinator of Technical Courses at UFRN's Metrópole Digital Institute, serving around 2,000 students. At the Metrópole Digital Institute, he is a collaborating member, as well as a member of the Academic Development Committee, Deputy Director of Teaching, and Deputy Coordinator of SETE, the Institute's Center for Integration, Research, and Innovation in Software Engineering. Marcel Oliveira has experience in Computer Science with an emphasis on Formal Methods. More specifically, his research has focused on refinement calculus and tactics, concurrency, the semantics of formal languages, the integration of formal methods, and code synthesis from formal specifications."
    orcid: "https://orcid.org/0000-0002-3023-2748"
    lattes: "http://lattes.cnpq.br/1756952696097255"
    webpage: "https://sites.dimap.ufrn.br/~marcel/"

  - name: "Marco Tulio Valente"
    slug: "marco-tulio-valente"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Federal University of Minas Gerais - UFMG"
    photo: "/img/team/marco-tulio-valente.png"
    bio: "Marco Tulio Valente is a Full Professor in the Department of Computer Science at the Federal University of Minas Gerais (UFMG). Before joining UFMG, he was a faculty member at PUC Minas for eleven years and spent four years in industry as a systems analyst at Telecommunications of Minas Gerais. He is the author of approximately 150 papers published in leading international journals and conferences, as well as more than one hundred publications in Brazilian venues. His work has received more than 9,000 citations. Together with his students, he has received more than 25 awards at national and international scientific events, and he has co-authored papers with more than 15 internationally recognized researchers. He has supervised more than 35 master's theses and 15 doctoral dissertations. The results of his research have been incorporated into code quality analysis tools and the official documentation of programming languages. In 2020, he published \"Engenharia de Software Moderna\", which became the leading textbook for Software Engineering education in Brazil and is currently adopted by more than 550 instructors. An English edition, \"Software Engineering: A Modern Approach\", was published in 2024 and is now used in more than 25 countries. In 2026, he is working on a new book on Software Comprehension, Maintenance, and Evolution."
    orcid: "https://orcid.org/0000-0002-8180-7548"
    lattes: "http://lattes.cnpq.br/2147157840592913"
    webpage: "https://homepages.dcc.ufmg.br/~mtov/"

  - name: "Rodrigo Bonifácio"
    slug: "rodrigo-bonifacio"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal de Pernambuco - CIn/UFPE"
    photo: "/img/team/rodrigo-bonifacio.jpg"
    bio: "Rodrigo Bonifácio is an Associate Professor at the Informatics Center (CIn) of the Federal University of Pernambuco (UFPE), Brazil. His research interests lie at the intersection of Software Engineering and Programming Languages, with a particular focus on program analysis, program transformation, software security, and software modernization. His work explores techniques and tools for understanding, analyzing, and evolving software systems, including applications of static and dynamic analysis. Rodrigo holds a PhD in Computer Science from the Informatics Center at UFPE, where he conducted his doctoral research under the supervision of Prof. Paulo Borba. Prior to joining CIn/UFPE, he served as an Assistant and later Associate Professor in the Department of Computer Science at the University of Brasília (CIC/UnB). Throughout his academic career, he has supervised three PhD dissertations and more than 20 master's dissertations. His research has received several distinctions. In 2019, he received the Journal of Systems and Software (JSS) Paper of the Year Award for the article \"Adopting DevOps in the Real World: A Theory, a Model, and a Case Study,\" co-authored with Welder Luz and Gustavo Pinto. In 2018 and 2019, he supervised the work of Diego Marcílio, \"Automatically Fixing Static Analysis Tools Violations,\" which received the Best Master's Dissertation Award at the Brazilian Conference on Software: Practice and Theory (CBSoft)."
    orcid: "https://orcid.org/0000-0002-2380-2829"
    lattes: "http://lattes.cnpq.br/0368311142108150"
    webpage: "https://rbonifacio.github.io/"

  - name: "Tiago Massoni"
    slug: "tiago-massoni"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Federal University of Campina Grande - UFCG"
    photo: "/img/team/tiago-massoni.jpg"
    bio: "Tiago Massoni is a Full Professor in the Department of Computing and Systems at the Federal University of Campina Grande (UFCG), where he has taught since 2009. He holds a Ph.D. in Computer Science from the Federal University of Pernambuco (UFPE, 2008), with a dissertation on model-driven formal refactoring. His research trajectory began in software verification and evolution, progressed toward human factors in software engineering — the focus of the SEbH research group he leads — and has more recently expanded into interdisciplinary computing research applied to public health."
    orcid: "https://orcid.org/0000-0002-9423-7556"
    lattes: "http://lattes.cnpq.br/3563923906851611"
    webpage: "https://tiagomassoni.github.io/"

  - name: "Vander Alves"
    slug: "vander-alves"
    category: "Faculty"
    role: "Faculty"
    affiliation: "University of Brasília - UnB"
    photo: "/img/team/vander-alves.jpg"
    bio: "Vander Alves is an Associate Professor in the Computer Science Department at the University of Brasília, Brazil. He holds a Ph.D. in Computer Science from the Federal University of Pernambuco and conducts research on software product lines, command and control, and formal methods. Currently, he is interested in constructive mechanized proofs of correctness for variability- and evolution-aware static analyses, as well as the automatic and certified generalization of their theory. Previously, he was a CAPES-Humboldt Experienced Research Fellow at the University of Passau (Germany) and held research and development positions at Fraunhofer IESE (Germany), Lancaster University (England), and IBM Silicon Valley Lab (USA)."
    orcid: "https://orcid.org/0000-0003-1573-048X"
    lattes: "http://lattes.cnpq.br/7500979195469357"
    webpage: "https://cic.unb.br/professores/133-valves"

  - name: "Vinicius Cardoso Garcia"
    slug: "vinicius-cardoso-garcia"
    category: "Faculty"
    role: "Faculty"
    affiliation: "Universidade Federal de Pernambuco - CIn/UFPE"
    photo: "/img/team/vinicius-cardoso-garcia.png"
    bio: "Vinicius Cardoso Garcia is an Associate Professor at the Centro de Informática (CIn) of the Universidade Federal de Pernambuco (UFPE), where he leads the Advanced System and Software Engineering Research Technologies (ASSERT) Lab. He is an Associate Researcher at TDSC and INES (National Institute of Science and Technology for Software Engineering). He holds a Ph.D. in Software Engineering, with extensive practical experience in complex, large-scale, and data-driven architectures, digital strategies, and innovation. Over his career, he has held research and engineering roles at institutions such as CESAR, USTORE, and Universität Mannheim. Since 2010, he has been actively developing R&D partnerships with startups and tech companies within the Porto Digital ecosystem."
    orcid: "https://orcid.org/0000-0001-6904-7470"
    lattes: "http://lattes.cnpq.br/6613487636748832"
    webpage: "https://viniciusgarcia.me"

  # ── Post-Doc Researchers ─────────────────────────────────────────────
  - name: "Heleno Campos"
    slug: "heleno-campos"
    category: "Post-Doc Researcher"
    role: "Post-Doc Researcher"
    affiliation: "Universidade Federal Fluminense - UFF"
    bio: "Heleno de Souza Campos Junior (Heleno Campos) is currently a Postdoc at the Computing Institute of Universidade Federal Fluminense (UFF) under a PDJ CNPq Scholarship Grant. He holds a D.Sc. (2025) degree in Computing from Universidade Federal Fluminense (UFF). He also holds a M.Sc. (2018) degree in Computer Science (Software Engineering) from Universidade Federal de Juiz de Fora (UFJF), and a B.Sc. (2016) degree in Information Systems from IF Sudeste MG. He held a CAPES scholarship for a sandwich program during the B.Sc. in 2013/2014, where he attended the University of Pisa, Italy. He also held a CAPES scholarship during his Master's and Doctorate's. His research interests include software testing and configuration management."
    orcid: "https://orcid.org/0000-0001-5541-0021"
    lattes: "http://lattes.cnpq.br/7179984988211505"
    webpage: "https://helenocampos.github.io/"

  - name: "Rafael Melo Macieira"
    slug: "rafael-melo-macieira"
    category: "Post-Doc Researcher"
    role: "Post-Doc Researcher"
    affiliation: "International Centre for Neuromorphic Systems (ICSN) - Western Sydney University (WSU)"
    photo: "/img/team/rafael-melo-macieira.jpg"
    bio: "Rafael Melo Macieira holds a Ph.D. in Computer Science from the Federal University of Pernambuco (UFPE), with more than 25 years of experience in computer systems development, applied research, and technological innovation. He currently works at the International Centre for Neuromorphic Systems (ICNS), Western Sydney University (WSU), Australia, on research and development in neuromorphic systems, computer architectures, and new approaches to data processing. His career spans hardware and software development projects, embedded systems, processor architectures, device drivers, and the integration of low-level components with computing applications. Throughout his professional and academic path, he has participated in research and development projects focused on creating and evaluating computing platforms, including studies on open architectures such as RISC-V and specialized systems for advanced applications. At UFPE, he pursued his training and research in Computer Science, contributing to scientific output and the training of professionals in the field. His experience combines work as both a researcher and systems engineer, with participation in initiatives spanning architecture definition and prototype development to the implementation and validation of computing solutions."
    orcid: "https://orcid.org/0000-0003-2592-0842"
    lattes: "http://lattes.cnpq.br/0687987855270877"
    webpage: "https://www.westernsydney.edu.au/icns/about/people/research-assistants/rafael-macieira"

  # ── Students (PhD, MSc, Undergraduate, ...) ──────────────────────────
  - name: "Fagner Dias"
    slug: "fagner-dias"
    category: "Student"
    role: "PhD Student"
    affiliation: "Universidade Federal do Rio Grande do Norte - UFRN"
    photo: "/img/team/fagner-dias.jpg"
    bio: "Fagner Morais Dias is a Ph.D. student in Computer Science at the Federal University of Rio Grande do Norte (UFRN), in the Graduate Program in Systems and Computing (PPgSC). He holds a Master's degree in Systems and Computing from the Federal University of Rio Grande do Norte (2022) and a specialization in technology applied to the legal field from UFRN in partnership with the Rio Grande do Norte Court of Justice (2019). He holds Bachelor's degrees in Software Engineering (2023) and Information Technology (2017), both from the Federal University of Rio Grande do Norte."
    orcid: "https://orcid.org/0000-0001-7398-8628"
    lattes: "http://lattes.cnpq.br/9457736660395718"

  - name: "Paulo Rolim"
    slug: "paulo-rolim"
    category: "Student"
    role: "PhD Student"
    affiliation: "Universidade Federal do Rio Grande do Norte - UFRN"
    photo: "/img/team/paulo-rolim.jpg"
    bio: "Paulo Eneas Rolim Bezerra is currently a Ph.D. student in the Graduate Program in Systems and Computing at the Federal University of Rio Grande do Norte, Brazil. He is a member of the RoboStar team and holds a degree in Law from Universidade Potiguar (2011), a technical/professional qualification from the Metrópole Digital Technical Course (IMD) at the Federal University of Rio Grande do Norte (2019), and a Master's degree in Systems and Computing from the Federal University of Rio Grande do Norte (2023). He has experience in Computer Science, working mainly on formal methods, software testing, safety-critical systems, and railway interlocking systems."
    orcid: "https://orcid.org/0009-0001-5662-6032"
    lattes: "http://lattes.cnpq.br/3932679417197996"
