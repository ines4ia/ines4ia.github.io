    bio: "Érico Medeiros is a Project Manager at CRIAR (CIn-UFPE), where he leads Research, Development, and Innovation (RD&I) initiatives focused on applying Artificial Intelligence and Robotics in real-world contexts. With solid experience in tech project management and agile methodologies, he leads multidisciplinary teams in delivering solutions that integrate AI, mobile applications, and intelligent systems. His work includes projects involving Large Language Models (LLMs), on-device AI execution, and applications in fields such as healthcare and automation, alongside his involvement in research initiatives that strengthen the technical and scientific foundation of the solutions developed."
