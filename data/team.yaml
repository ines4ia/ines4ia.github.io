    affiliation: "University of Brasília - UnB"
    photo: "/img/team/vinicius-assumpcao-de-araujo.png"
    bio: "Vinicius Assumpção de Araujo is a Software Engineering graduate and a Master's student in Computer Science at the University of Brasília (UnB), Brazil. His research focuses on Software Engineering and Artificial Intelligence, particularly the use of Large Language Models to support legacy software modernization. He investigates specification-driven approaches for extracting structured knowledge from legacy systems, generating API contracts and adapters, and validating behavioral and semantic equivalence throughout the modernization process. His broader interests include AI-assisted software engineering, software evolution, game design, creative writing, and cybersecurity."
