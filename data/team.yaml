    role: "PhD Student"
    affiliation: "Universidade Federal de Pernambuco - CIn/UFPE"
    bio: "Renato Domingues is a Ph.D. student at the Centro de Informática (CIn) of the Universidade Federal de Pernambuco (UFPE), Brazil. His research aims to improve software engineering practices through large-scale empirical studies of software repositories. His research interests include Mining Software Repositories, AI-assisted Software Engineering, software maintenance, and the impact of large language models and AI coding agents on software development."
