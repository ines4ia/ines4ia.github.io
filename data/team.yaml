    bio: "Tales Vinicius Alves da Cunha is a Computer Science M.Sc. student at the Universidade Federal de Pernambuco (UFPE), Brazil, where he also received his B.Sc. in Computer Science. His research investigates the application of Artificial Intelligence and Large Language Models (LLMs) to software engineering challenges, with a particular focus on AI-generated pull requests, exception handling practices and anti-patterns, and test coverage. He also has practical industry experience as a backend developer, designing scalable architectures and robust data processing pipelines, and previously developed for UFPE's autonomous robotics team, RobôCIn."
