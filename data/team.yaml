  - name: "Heleno Campos"
    slug: "heleno-campos"
    category: "Post-Doc Researcher"
    role: "Post-Doc Researcher"
    affiliation: "Universidade Federal Fluminense - UFF"
    bio: "Heleno de Souza Campos Junior (Heleno Campos) is currently a Postdoc at the Computing Institute of Universidade Federal Fluminense (UFF) under a PDJ CNPq Scholarship Grant. He holds a D.Sc. (2025) degree in Computing from Universidade Federal Fluminense (UFF). He also holds a M.Sc. (2018) degree in Computer Science (Software Engineering) from Universidade Federal de Juiz de Fora (UFJF), and a B.Sc. (2016) degree in Information Systems from IF Sudeste MG. He held a CAPES scholarship for a sandwich program during the B.Sc. in 2013/2014, where he attended the University of Pisa, Italy. He also held a CAPES scholarship during his Master's and Doctorate's. His research interests include software testing and configuration management."
    orcid: "https://orcid.org/0000-0001-5541-0021"
    lattes: "http://lattes.cnpq.br/7179984988211505"
    webpage: "https://helenocampos.github.io/"

  - name: "Leuson Da Silva"
    slug: "leuson-da-silva"
    category: "Post-Doc Researcher"
    role: "Post-Doc Researcher"
    affiliation: "Polytechnique Montreal"
    photo: "/img/team/leuson-da-silva.png"
    bio: "Leuson Da Silva is a Postdoctoral Fellow at Polytechnique Montréal, Canada. He holds a Ph.D. and an M.Sc. in Computer Science from the Universidade Federal de Pernambuco (UFPE), Brazil, and a B.Sc. in Software Engineering from the Universidade Federal do Ceará (UFC), Brazil. During his bachelor's degree, he completed an international academic exchange at the Technical University of Munich (TUM), Germany (2013), and, during his Ph.D., he was a visiting researcher at Chalmers University of Technology, Sweden (2019). His research investigates methods and tools to support software developers in their daily activities and improve the quality and productivity of software development. His work has particularly focused on code integration conflicts, including build, test, and semantic conflicts, as well as software testing, code review, refactoring, and AI-assisted software engineering."
    orcid: "https://orcid.org/0000-0002-9086-9038"
    lattes: "http://lattes.cnpq.br/8681457281512244"
    webpage: "https://leusonmario.github.io/"

  - name: "Rafael Melo Macieira"
    slug: "rafael-melo-macieira"
    category: "Post-Doc Researcher"
    role: "Post-Doc Researcher"
    affiliation: "International Centre for Neuromorphic Systems (ICSN) - Western Sydney University (WSU)"
    photo: "/img/team/rafael-melo-macieira.jpg"
    bio: "Rafael Melo Macieira holds a Ph.D. in Computer Science from the Federal University of Pernambuco (UFPE), with more than 25 years of experience in computer systems development, applied research, and technological innovation. He currently works at the International Centre for Neuromorphic Systems (ICNS), Western Sydney University (WSU), Australia, on research and development in neuromorphic systems, computer architectures, and new approaches to data processing. His career spans hardware and software development projects, embedded systems, processor architectures, device drivers, and the integration of low-level components with computing applications. Throughout his professional and academic path, he has participated in research and development projects focused on creating and evaluating computing platforms, including studies on open architectures such as RISC-V and specialized systems for advanced applications. At UFPE, he pursued his training and research in Computer Science, contributing to scientific output and the training of professionals in the field. His experience combines work as both a researcher and systems engineer, with participation in initiatives spanning architecture definition and prototype development to the implementation and validation of computing solutions."
    orcid: "https://orcid.org/0000-0003-2592-0842"
    lattes: "http://lattes.cnpq.br/0687987855270877"
    webpage: "https://www.westernsydney.edu.au/icns/about/people/research-assistants/rafael-macieira"

