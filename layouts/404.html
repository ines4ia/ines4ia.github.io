{{ define "main" }}
<section class="error-404-section">
  <div class="container error-404-container">
    <div class="error-404-badge">404</div>
    <h1 class="error-404-title">Page Not Found</h1>
    <p class="error-404-desc">
      The page you are looking for doesn't exist, has been moved, or the URL was entered incorrectly.
    </p>
    <div class="error-404-actions">
      <a href="{{ "/" | relLangURL }}" class="btn btn-primary">Back to Homepage</a>
    </div>
  </div>
</section>
{{ end }}
