{{ define "main" }}
<div class="page-hero">
  <div class="container">
    {{ with .Params.label }}<p class="section-label">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</div>

<div class="page-body">
  <div class="container">
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</div>
{{ end }}
